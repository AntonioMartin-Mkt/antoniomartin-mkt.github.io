<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Antonio José Martín · Portfolio</title>
<meta name="description" content="Portfolio de marketing digital y publicidad: email marketing, web, automatizaciones, contenido y redes sociales.">
<meta name="theme-color" content="#fcfcfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Lienzo blanco, letra principal en negro y secundaria en gris.
   El color lo ponen los trabajos.
   ========================================================= */
:root{
  color-scheme:light;
  --bg:#fcfcfb; --ink:#141414; --grey:#8b8b88; --grey-2:#b9b9b5; --line:rgba(20,20,20,.08);
  --glass:rgba(244,244,242,.72);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.36,.5,1);
  --r:22px; /* esquinas de las ventanas */
  --head:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:clip}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
::selection{background:#141414;color:#fff}
.g{color:var(--grey)}

/* ---------- Cabecera ---------- */
.top{position:fixed;inset:0 0 auto;z-index:40;height:var(--head);padding:0 clamp(16px,2.4vw,32px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:13px;pointer-events:none}
.top > *{pointer-events:auto}
.top nav{display:flex;gap:20px;align-items:center}
.top nav a,.top nav button{color:var(--ink);transition:color .2s}
.top nav a:hover,.top nav button:hover{color:var(--grey)}
.top .right{justify-self:end}
.brand{text-align:center;line-height:1.2;font-size:13px}
.brand span{display:block}
.brand .g{transition:color .2s}
.brand:hover .g{color:var(--ink)}
.brand{transition:opacity .3s,filter .3s}
.dock-open .brand{opacity:0;filter:blur(6px);pointer-events:none}
.dockbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s var(--spring),background-color .2s}
.dockbtn:hover{transform:scale(1.08)}
.dockbtn:active{transform:scale(.94)}
.dockbtn i{display:grid;grid-template-columns:repeat(2,4px);gap:3px}
.dockbtn i b{width:4px;height:4px;border-radius:1.5px;background:var(--ink);transition:transform .3s var(--ease)}
.dock-open .dockbtn i b:nth-child(1){transform:translate(3.5px,3.5px)}
.dock-open .dockbtn i b:nth-child(2){transform:translate(-3.5px,3.5px)}
.dock-open .dockbtn i b:nth-child(3){transform:translate(3.5px,-3.5px)}
.dock-open .dockbtn i b:nth-child(4){transform:translate(-3.5px,-3.5px)}
.cur{position:relative}
.cur::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.cur:hover::after{transform:scaleX(1)}
/* Sobre un trabajo abierto, la cabecera toma el color de su texto */
.case-open .top{color:var(--case-ink)}
.case-open .top nav a,.case-open .top nav button,.case-open .brand,.case-open .brand .g{color:var(--case-ink)}
.case-open .dockbtn i b{background:var(--case-ink)}
.case-open .dockbtn{background:color-mix(in srgb,var(--case-bg) 70%,#fff 30%)}

/* ---------- Burbuja de proyectos (sale del botón de la izquierda de Proyectos) ---------- */
.dock{position:fixed;z-index:45;top:12px;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;height:46px;padding:5px;border-radius:999px;display:flex;align-items:center;gap:4px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 1px 0 rgba(255,255,255,.9),0 10px 40px rgba(20,20,20,.10),0 1px 2px rgba(20,20,20,.06);
  transform-origin:0 50%;visibility:hidden;opacity:0}
.dock.on{visibility:visible;opacity:1}
.dock .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--grey);transition:background-color .2s,color .2s}
.dock .x:hover{background:rgba(20,20,20,.06);color:var(--ink)}
.dock .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.dock .it{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:transform .3s var(--spring),background-color .2s}
.dock .it:hover,.dock .it[aria-current="true"]{background:rgba(255,255,255,.75)}
.dock .it img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.dock .it img.cover{object-fit:cover;border-radius:7px;box-shadow:0 0 0 1px var(--line)}
.dock .it .sw{width:28px;height:28px;border-radius:8px;background:var(--c1);display:grid;place-items:center;font:600 13px/1 var(--sans);color:var(--t1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.dock .it .tip{position:absolute;top:calc(100% + 8px);left:50%;translate:-50% 0;white-space:nowrap;font-size:12px;color:var(--ink);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:4px 9px;border-radius:999px;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.06);opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.dock .it:hover .tip,.dock .it:focus-visible .tip{opacity:1;transform:none}

/* ---------- Portada ---------- */
.hero{min-height:100dvh;padding:calc(var(--head) + 40px) clamp(16px,2.4vw,32px) 120px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-weight:400;font-size:clamp(30px,4.4vw,62px);line-height:1.08;letter-spacing:-.035em;max-width:20ch;text-wrap:balance}
.hero h1 .ln{display:block}
.hero .sub{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 28px;font-size:13px;color:var(--grey)}
.hero .sub a{color:var(--ink)}

/* Barra fija de abajo */
.bottom{position:fixed;inset:auto 0 0;z-index:30;height:52px;padding:0 clamp(16px,2.4vw,32px);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--grey);pointer-events:none;transition:opacity .3s}
.case-open .bottom{opacity:0}

/* ---------- Trabajos: uno a uno, nítido el que está en el centro ---------- */
.works{position:relative}
.stage{position:relative;min-height:100dvh;display:grid;place-items:center;padding:calc(var(--head) + 20px) 16px 110px;overflow:clip}
.stage .depth{position:absolute;inset:0;pointer-events:none}
.stage .depth img{position:absolute;width:clamp(90px,11vw,170px);filter:blur(var(--b,7px)) drop-shadow(0 18px 18px rgba(0,0,0,.12));opacity:.85}
.obj:focus-visible{outline-offset:10px;border-radius:30px}
.obj{position:relative;cursor:pointer;display:grid;place-items:center;perspective:1200px;will-change:transform,filter}
.obj .lift{transform-style:preserve-3d;transition:transform .7s var(--ease)}
.obj .shadow{position:absolute;left:50%;bottom:-46px;width:60%;height:26px;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(20,20,20,.22),transparent);filter:blur(6px);transition:transform .7s var(--ease),opacity .7s}
.obj:hover .shadow{transform:scale(.88);opacity:.75}
/* Objeto 3D recortado */
.obj.cut img{width:min(56vw,400px);height:auto;filter:drop-shadow(0 30px 34px rgba(20,20,20,.16))}
/* Ventana horizontal (web) */
.win{width:min(82vw,820px);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 40px 80px -20px rgba(20,20,20,.28),0 12px 24px -12px rgba(20,20,20,.2)}
.win .bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#f2f2f0;border-bottom:1px solid var(--line)}
.win .bar i{width:9px;height:9px;border-radius:50%;background:#dcdcd8}
.win img{width:100%;height:auto;aspect-ratio:var(--ar,16/10);object-fit:cover;object-position:top}
/* Ventana vertical (email o móvil): al pasar el ratón, la pieza se desplaza dentro */
.win.tall{width:min(64vw,340px)}
.win.tall .vp{aspect-ratio:4/5;overflow:hidden}
.win.tall .vp img{aspect-ratio:auto;height:auto;transition:transform 2.6s var(--ease)}
.obj:hover .win.tall .vp img{transform:translateY(calc(-100% + min(64vw,340px) * 1.25))}
/* Tarjeta de color cuando aún no hay imagen */
.tile{width:min(72vw,430px);aspect-ratio:1;border-radius:calc(var(--r) + 6px);background:var(--c1);color:var(--t1);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:28px;box-shadow:0 40px 80px -24px color-mix(in srgb,var(--c1) 70%,#000 30%),0 0 0 1px rgba(0,0,0,.04)}
.tile::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:var(--c2);right:-22%;top:-26%;transition:transform 1s var(--ease)}
.tile::after{content:"";position:absolute;inset:auto 0 0;height:22%;background:var(--c3);opacity:.9}
.obj:hover .tile::before{transform:translate(-8%,8%) scale(1.06)}
.tile b{position:relative;z-index:1;margin-bottom:calc(22% - 8px);font-weight:500;font-size:clamp(30px,4.2vw,50px);line-height:.98;letter-spacing:-.045em;max-width:8ch}
.tile small{position:relative;z-index:1;font-size:13px;opacity:.8}
.cap{position:absolute;left:0;right:0;bottom:70px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;text-align:center;padding:0 16px}
.cap .t{color:var(--ink)}
.cap .m{color:var(--grey)}
/* Etiqueta que sigue al ratón */
.tag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font-size:12px;white-space:nowrap;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(0,0,0,.07);opacity:0;transition:opacity .2s}
.tag.on{opacity:1}
.tag .g{margin-left:4px}

/* ---------- Bloques de texto ---------- */
.block{padding:clamp(110px,16vw,200px) clamp(16px,2.4vw,32px);max-width:1280px;margin:0 auto}
.lead{font-weight:400;font-size:clamp(24px,3vw,40px);line-height:1.18;letter-spacing:-.03em;max-width:26ch;text-wrap:pretty}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px clamp(28px,5vw,80px);margin-top:clamp(70px,9vw,120px)}
.cols h3{font-weight:400;font-size:15px;letter-spacing:-.01em}
.cols p{color:var(--grey);margin-top:4px;max-width:44ch}
.label{font-size:13px;color:var(--grey);margin-bottom:22px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(56px,7vw,90px)}
.tools span{font-size:13px;padding:7px 13px;border-radius:999px;background:#f1f1ef;color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;margin-top:clamp(70px,9vw,120px)}
.nums b{display:block;font-weight:400;font-size:clamp(34px,4vw,52px);letter-spacing:-.04em;line-height:1}
.nums span{display:block;color:var(--grey);margin-top:8px;max-width:26ch}
.portrait{width:min(300px,62vw);aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;margin-bottom:56px;box-shadow:0 30px 60px -24px rgba(0,0,0,.25)}
.portrait img{width:100%;height:100%;object-fit:cover}

/* Contacto */
.contact{min-height:90dvh;display:flex;flex-direction:column;justify-content:center}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-weight:400;font-size:clamp(28px,5.6vw,80px);letter-spacing:-.045em;line-height:1.05}
.mail a{overflow-wrap:anywhere}
.copy{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f1f1ef;transition:transform .25s var(--spring),background-color .2s}
.copy:hover{background:#e8e8e5}
.copy:active{transform:scale(.92)}
.copy svg{width:18px;height:18px}
.copy .ok{display:none}
.copy.done .ok{display:block}
.copy.done .cp{display:none}
.links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:40px;font-size:15px}
.links a{color:var(--grey);transition:color .2s}
.links a:hover{color:var(--ink)}
.toast{font-size:13px;color:var(--grey);margin-top:14px;min-height:20px}
footer{padding:28px clamp(16px,2.4vw,32px) 80px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--grey)}

/* ---------- Ficha de un trabajo (se abre desde su ventana) ---------- */
.case{position:fixed;inset:0;z-index:35;overflow-y:auto;overscroll-behavior:contain;background:var(--case-bg);color:var(--case-ink);visibility:hidden;clip-path:inset(50% round 30px)}
.case.on{visibility:visible}
.case .in{max-width:1040px;margin:0 auto;padding:calc(var(--head) + 56px) clamp(16px,3vw,32px) 140px}
.case .hero-w{border-radius:var(--r);overflow:hidden;background:color-mix(in srgb,var(--case-bg) 82%,#fff 18%);box-shadow:0 50px 100px -40px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.05);aspect-ratio:16/10;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.case .hero-w img.full{width:100%;height:100%;object-fit:cover;object-position:top}
.case .hero-w img.cut{width:56%;height:auto;filter:drop-shadow(0 30px 30px rgba(0,0,0,.22))}
.case .hero-w .tile{box-shadow:none;width:52%}
.case .more{margin-top:clamp(60px,8vw,96px);display:grid;place-items:center;padding:clamp(28px,5vw,64px);border-radius:var(--r);background:color-mix(in srgb,var(--case-bg) 82%,#fff 18%)}
.case .more .win{width:min(100%,760px)}
.case .more .win.tall{width:min(100%,380px)}
.case .more .win.tall .vp{aspect-ratio:auto;max-height:78vh;overflow:auto}
/* Ventana con el trabajo real: se puede hacer scroll dentro */
.live{border-radius:var(--r);overflow:hidden;background:#fff;color:#141414;box-shadow:0 50px 100px -40px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.08);display:flex;flex-direction:column;height:min(80dvh,860px);margin-inline:auto}
.live.email{max-width:720px}
.live .bar{flex:none;height:38px;display:flex;align-items:center;gap:6px;padding:0 14px;background:#f2f2f0;border-bottom:1px solid rgba(0,0,0,.07);font-size:12px;color:#6d6d6a}
.live .bar i{width:10px;height:10px;border-radius:50%;background:#dcdcd8;flex:none}
.live .bar span{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.live .bar a{flex:none;color:#141414;padding:4px 8px;border-radius:6px}
.live .bar a:hover{background:rgba(0,0,0,.06)}
.live iframe{flex:1;width:100%;border:0;background:#fff}
.live .pages{flex:1;overflow-y:auto;overscroll-behavior:contain;background:#e9e8e4;padding:clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:clamp(10px,2vw,20px);align-items:center}
.live .pages canvas{width:100%;max-width:1100px;height:auto;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);background:#fff}
.live .wait{margin:auto;font-size:13px;color:#6d6d6a}
.case .hint{text-align:center;font-size:13px;opacity:.65;margin-top:14px}
.case .txt{max-width:560px;margin:clamp(60px,8vw,96px) auto 0}
.case h2{font-weight:400;font-size:clamp(26px,3.2vw,38px);line-height:1.12;letter-spacing:-.035em;text-wrap:balance}
.case .meta{margin-top:10px;font-size:13px;opacity:.6}
.case .res{margin-top:34px;font-size:clamp(17px,1.6vw,19px);line-height:1.5;letter-spacing:-.015em}
.case dl{margin-top:40px;display:grid;gap:28px}
.case dt{font-size:13px;opacity:.6}
.case dd{margin-top:6px;line-height:1.6}
.case .tl{display:flex;flex-wrap:wrap;gap:8px;margin-top:36px}
.case .tl span{font-size:13px;padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--case-ink) 9%,transparent)}
.case .go{display:inline-flex;align-items:center;gap:10px;margin-top:40px;height:46px;padding:0 22px;border-radius:999px;background:var(--case-ink);color:var(--case-bg);font-size:15px;transition:transform .25s var(--spring)}
.case .go:hover{transform:translateY(-2px)}
.case .go:active{transform:scale(.97)}
.case .next{display:block;margin-top:clamp(100px,14vw,170px);padding-top:28px;border-top:1px solid color-mix(in srgb,var(--case-ink) 18%,transparent)}
.case .next small{font-size:13px;opacity:.6}
.case .next span{display:block;margin-top:6px;font-size:clamp(26px,3.6vw,44px);letter-spacing:-.04em;line-height:1.1;transition:opacity .2s}
.case .next:hover span{opacity:.65}
.case .shut{position:fixed;right:clamp(16px,2.4vw,32px);bottom:20px;z-index:2;height:40px;padding:0 16px;border-radius:999px;background:color-mix(in srgb,var(--case-bg) 60%,#fff 40%);backdrop-filter:blur(12px);font-size:13px;color:var(--case-ink);box-shadow:0 0 0 1px rgba(0,0,0,.06)}

/* ---------- Móvil ---------- */
@media (max-width:720px){
  .top{grid-template-columns:auto 1fr auto;gap:12px}
  .top .left a+a{display:none}
  .brand{text-align:center}
  .brand span+span{display:none}
  .top .right{gap:12px}
  .top .right .cv{display:none}
  .cols{grid-template-columns:1fr}
  .cap{bottom:64px}
  .bottom{font-size:11px}
  .dock{top:auto;bottom:14px}
  .dock .it .tip{top:auto;bottom:calc(100% + 8px)}
  .case .hero-w{aspect-ratio:4/5}
  .live{height:72dvh}
  .case .shut{display:none}
  .mail{font-size:5.6vw}
  .case .in{padding-bottom:110px}
  .case .hero-w img.cut{width:78%}
  .case .hero-w .tile{width:78%}
}

/* Movimiento reducido: todo aparece quieto y nítido */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="top" id="top">
  <nav class="left" aria-label="Secciones">
    <a class="cur" href="#sobre-mi">Sobre mí</a>
    <a class="cur" href="#contacto">Contacto</a>
  </nav>
  <a class="brand" href="#inicio" id="brand" aria-label="Inicio"></a>
  <nav class="right" aria-label="Trabajos">
    <button class="dockbtn" id="dockbtn" type="button" aria-expanded="false" aria-controls="dock" aria-label="Abrir la barra de proyectos"><i aria-hidden="true"><b></b><b></b><b></b><b></b></i></button>
    <a class="cur" href="#trabajos" id="projlink">Proyectos</a>
    <a class="cur cv" id="cvlink" href="#" download hidden>CV</a>
  </nav>
</header>

<div class="dock" id="dock" role="toolbar" aria-label="Proyectos">
  <button class="x" id="dockx" type="button" aria-label="Cerrar la barra">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <div id="dockitems" style="display:flex;gap:4px"></div>
</div>

<main id="inicio">
  <section class="hero" aria-label="Presentación">
    <h1 id="frase"></h1>
    <div class="sub" id="sub"></div>
  </section>

  <div class="works" id="trabajos"></div>

  <section class="block" id="sobre-mi" aria-label="Sobre mí">
    <div class="portrait" id="photo" hidden></div>
    <p class="label">Sobre mí</p>
    <p class="lead" id="about"></p>
    <div class="nums" id="nums" hidden></div>
    <div class="cols" id="skills"></div>
    <div class="tools" id="tools"></div>
  </section>

  <section class="block contact" id="contacto" aria-label="Contacto">
    <p class="label">¿Hablamos?</p>
    <div class="mail">
      <a id="mail" href="#"></a>
      <button class="copy" id="copy" type="button" aria-label="Copiar email">
        <svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <div class="links" id="links"></div>
  </section>
</main>

<footer id="foot"></footer>
<div class="bottom" aria-hidden="true"><span id="b-left"></span><span id="b-right"></span></div>
<div class="tag" id="tag" aria-hidden="true"></div>

<div class="case" id="case" role="dialog" aria-modal="true" aria-labelledby="c-title" tabindex="-1">
  <div class="in" id="case-in"></div>
  <button class="shut" id="shut" type="button">Cerrar</button>
</div>

<!-- Tus datos y trabajos están en proyectos.js (es el único archivo que editas) -->
<script src="proyectos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/* ---------- A partir de aquí no hace falta tocar nada ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = PERFIL;
const QUIETO = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TACTIL = matchMedia("(hover: none)").matches;
const MOTOR = !QUIETO && window.gsap && window.ScrollTrigger;

/* Colores: paleta por categoría si el trabajo no trae la suya */
const COLORES = {
  "Diseño":["#FF4F79","#FFB627","#1d1d1f"],
  "Presentaciones":["#8338EC","#FF4F79","#1d1d1f"],
  "Web":["#2EC4B6","#3A86FF","#1d1d1f"],
  "Email marketing":["#FFB627","#FF4F79","#1d1d1f"],
  "Automatización":["#3A86FF","#2EC4B6","#1d1d1f"],
  "Redes sociales":["#E1306C","#FFB627","#8338EC"],
  "Estrategia":["#1d1d1f","#3A86FF","#FFB627"]
};
function rgb(h){ h=(h||"#141414").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function lum(h){ return rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0); }
const sobre = h => lum(h) > .32 ? "#141414" : "#ffffff";
function cols(p){ const c = (p.colores && p.colores.length ? p.colores : (COLORES[p.categoria] || ["#141414","#3A86FF","#f1f1ef"])); return [c[0], c[1]||c[0], c[2]||c[1]||c[0]]; }
const vars = p => { const [a,b,c] = cols(p); return `--c1:${a};--c2:${b};--c3:${c};--t1:${sobre(a)}`; };

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const anio = f => String(f||"").split("-")[0];
const fechaTexto = f => { const [a,m] = String(f||"").split("-"); return m ? `${MESES[+m-1]||m} ${a}` : (a||""); };
const ctxTexto = c => c === "Clase" ? "Trabajo de clase" : c;
const corto = p => p.corto || p.titulo;
const hist = (m,u) => { try { history[m](null, "", u); } catch (e) {} };
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
const pendiente = t => /^EJEMPLO|XX|^Qué (problema|hiciste|se consiguió)/i.test(String(t||""));

/* Orden: destacados primero, luego los más recientes */
const lista = [...PROYECTOS].sort((a,b)=>(b.destacado?1:0)-(a.destacado?1:0) || (b.objeto||b.imagen?1:0)-(a.objeto||a.imagen?1:0) || (b.fecha||"").localeCompare(a.fecha||""));
lista.forEach(p => p._id = slug(corto(p)));

/* ---------- Cabecera, portada y barra de abajo ---------- */
const partes = P.nombre.split(" ");
$("brand").innerHTML = `<span>${esc(partes.slice(0,2).join(" "))}</span><span>${esc(partes.slice(2).join(" ") || "")}</span><span class="g">${esc(P.rol.split("·")[0].trim())}</span>`;
$("frase").innerHTML = `<span class="ln">${esc(P.nombre)}.</span><span class="ln g">${esc(P.frase)}</span>`;
$("sub").innerHTML = [
  P.disponible ? `<span>${esc(P.disponible)}</span>` : "",
  `<span>${esc(P.rol)}</span>`,
  `<a class="cur" href="#trabajos">Ver ${lista.length} trabajos</a>`
].join("");
$("b-left").textContent = P.rol.replace(/\s*·\s*/g, ", ");
$("b-right").textContent = P.ubicacion || "";
$("cvlink").href = P.cv || "#";
if (P.cv) fetch(P.cv,{method:"HEAD"}).then(r=>{ if(r.ok) $("cvlink").hidden=false; }).catch(()=>{});

/* ---------- Un escenario por trabajo ---------- */
function visual(p, enFicha){
  if (p.objeto) return `<img class="${enFicha?"cut":""}" src="${esc(p.objeto)}" alt="${esc(corto(p))}" ${enFicha?"":'loading="lazy"'}>`;
  if (p.imagen) return enFicha ? `<img class="full" src="${esc(p.imagen)}" alt="${esc(corto(p))}">` : null;
  return `<div class="tile" style="${vars(p)}"><small>${esc(p.categoria)}</small><b>${esc(corto(p))}</b></div>`;
}
$("trabajos").innerHTML = lista.map((p,i)=>{
  let pieza;
  if (p.objeto) {
    pieza = `<div class="lift">${visual(p)}</div><span class="shadow"></span>`;
  } else if (p.imagen) {
    pieza = `<div class="lift"><div class="win" data-shot><div class="bar"><i></i><i></i><i></i></div><div class="vp"><img src="${esc(p.imagen)}" alt="${esc(corto(p))}" loading="lazy"></div></div></div><span class="shadow"></span>`;
  } else {
    pieza = `<div class="lift">${visual(p)}</div><span class="shadow"></span>`;
  }
  const fondo = (p.extras||[]).slice(0,4).map((src,k)=>{
    const pos = [["8%","18%",8],["78%","12%",11],["14%","64%",12],["74%","60%",7]][k];
    return `<img src="${esc(src)}" alt="" loading="lazy" style="left:${pos[0]};top:${pos[1]};--b:${pos[2]}px" data-d="${(k%2?1:-1)*(40+k*25)}">`;
  }).join("");
  return `<section class="stage" id="${p._id}" style="${vars(p)}" aria-label="${esc(corto(p))}">
    ${fondo ? `<div class="depth" aria-hidden="true">${fondo}</div>` : ""}
    <button class="obj ${p.objeto?"cut":""}" type="button" data-i="${i}" aria-label="Ver el caso: ${esc(p.titulo)}">${pieza}</button>
    <div class="cap"><span class="t">${esc(corto(p))}</span><span class="m">${esc(p.categoria)}, ${esc(anio(p.fecha))}</span></div>
  </section>`;
}).join("");

/* Las capturas verticales (emails, móvil) van en ventana alta */
function ventanas(root){ root.querySelectorAll("[data-shot] img").forEach(im=>{
  const fija = () => { const w = im.closest(".win"); if (im.naturalHeight > im.naturalWidth) w.classList.add("tall"); else w.style.setProperty("--ar", `${im.naturalWidth}/${Math.min(im.naturalHeight, im.naturalWidth*.68)}`); };
  im.complete && im.naturalWidth ? fija() : im.addEventListener("load", fija, {once:true});
}); }
ventanas(document);

/* ---------- Sobre mí ---------- */
const frases = (P.sobreMi||"").split(/(?<=\.)\s+/);
$("about").innerHTML = frases.map((f,k)=> k===0 ? esc(f) : `<span class="g">${esc(f)}</span>`).join(" ");
const cifras = (P.cifras||[]).filter(c=>!pendiente(c.valor));
if (cifras.length) { $("nums").hidden = false; $("nums").innerHTML = cifras.map(c=>`<div><b>${esc(c.valor)}</b><span>${esc(c.texto)}</span></div>`).join(""); }
$("skills").innerHTML = (P.habilidades||[]).map(h=>`<div><h3>${esc(h.titulo)}</h3><p>${esc(h.texto)}</p></div>`).join("");
$("tools").innerHTML = (P.herramientas||[]).map(h=>`<span>${esc(h)}</span>`).join("");
if (P.foto) { const im = new Image(); im.alt = P.nombre; im.onload = () => { $("photo").appendChild(im); $("photo").hidden = false; }; im.src = P.foto; }

/* ---------- Contacto ---------- */
$("mail").textContent = P.email; $("mail").href = "mailto:" + P.email;
$("copy").addEventListener("click", () => {
  const b = $("copy");
  const hecho = () => { b.classList.add("done"); $("toast").textContent = "Email copiado"; setTimeout(()=>{ b.classList.remove("done"); $("toast").textContent = ""; }, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(P.email).then(hecho, ()=>{ location.href = "mailto:" + P.email; });
  else location.href = "mailto:" + P.email;
});
$("links").innerHTML = (P.perfiles||[]).filter(r=>r.url && !r.url.startsWith("mailto:"))
  .map(r=>`<a class="cur" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nombre)}</a>`).join("");
$("foot").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(P.nombre)}</span><span>Diseñado y programado por mí</span>`;

/* ---------- Scroll suave ---------- */
let lenis = null;
if (MOTOR && window.Lenis && !TACTIL) {
  lenis = new Lenis({ duration: 1.15, easing: t => 1 - Math.pow(1 - t, 4) });
  lenis.on("scroll", ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);
}
function irA(sel){
  const el = typeof sel === "string" ? document.querySelector(sel) : sel;
  if (!el) return;
  lenis ? lenis.scrollTo(el, { offset: 0 }) : el.scrollIntoView({ behavior: QUIETO ? "auto" : "smooth" });
}
document.addEventListener("click", e=>{
  const a = e.target.closest('a[href^="#"]');
  if (!a || a.id === "cvlink") return;
  const h = a.getAttribute("href");
  if (h.length > 1 && document.querySelector(h)) { e.preventDefault(); if (caseOpen) cerrarCaso(true); irA(h); }
});

/* ---------- La página se construye al bajar: lo del centro nítido, lo demás borroso ---------- */
if (MOTOR) {
  gsap.registerPlugin(ScrollTrigger);

  /* Entrada de la portada, línea a línea */
  gsap.from("#frase .ln, #sub > *", { y: 34, opacity: 0, filter: "blur(10px)", duration: 1.2, ease: "expo.out", stagger: .09, delay: .15 });
  gsap.from(".top, .bottom", { opacity: 0, duration: 1, ease: "power2.out", stagger: .1, delay: .5 });

  /* La portada se desenfoca y se aleja cuando empiezan los trabajos */
  gsap.to(".hero", { filter: "blur(10px)", opacity: .25, scale: .97, ease: "none",
    scrollTrigger: { trigger: ".hero", start: "40% top", end: "bottom top", scrub: true } });

  /* Cada trabajo llega borroso, se enfoca en el centro y se va borroso */
  document.querySelectorAll(".stage").forEach(st=>{
    const obj = st.querySelector(".obj"), cap = st.querySelector(".cap");
    const tl = gsap.timeline({ scrollTrigger: { trigger: st, start: "top bottom", end: "bottom top", scrub: .6 } });
    tl.fromTo(obj, { y: 140, scale: .78, rotateX: 14, filter: "blur(18px)", opacity: .2 },
                   { y: 0, scale: 1, rotateX: 0, filter: "blur(0px)", opacity: 1, ease: "power3.out", duration: .42 })
      .to(obj, { duration: .16 })
      .to(obj, { y: -130, scale: .86, rotateX: -10, filter: "blur(16px)", opacity: .15, ease: "power2.in", duration: .42 });
    gsap.timeline({ scrollTrigger: { trigger: st, start: "top bottom", end: "bottom top", scrub: .6 } })
      .fromTo(cap, { y: 30, opacity: 0, filter: "blur(6px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: .4 })
      .to(cap, { duration: .2 })
      .to(cap, { y: -20, opacity: 0, filter: "blur(6px)", duration: .4 });
    st.querySelectorAll(".depth img").forEach(im=>{
      gsap.fromTo(im, { y: +im.dataset.d * 2.2 }, { y: -im.dataset.d * 2.2, ease: "none",
        scrollTrigger: { trigger: st, start: "top bottom", end: "bottom top", scrub: true } });
    });
    /* El trabajo que está en el centro se marca en la barra de proyectos */
    ScrollTrigger.create({ trigger: st, start: "top center", end: "bottom center",
      onToggle: s => { if (s.isActive) marcar(st.id); } });
  });

  /* Textos: aparecen enfocándose, una pieza tras otra */
  gsap.utils.toArray(".label, .lead, .nums > div, .cols > div, .tools, .mail, .links, .portrait").forEach(el=>{
    gsap.from(el, { y: 40, opacity: 0, filter: "blur(12px)", duration: 1.1, ease: "expo.out",
      scrollTrigger: { trigger: el, start: "top 88%" } });
  });
  /* El párrafo de "Sobre mí" se enfoca frase a frase mientras bajas */
  const spans = document.querySelectorAll("#about .g");
  if (spans.length) gsap.fromTo(spans, { filter: "blur(5px)", opacity: .35 }, { filter: "blur(0px)", opacity: 1, stagger: .2, ease: "none",
    scrollTrigger: { trigger: "#about", start: "top 80%", end: "bottom 80%", scrub: true } });
}

/* ---------- Ventanas con inclinación 3D y etiqueta junto al ratón ---------- */
const tag = $("tag");
if (!TACTIL && !QUIETO) {
  document.querySelectorAll(".obj").forEach(o=>{
    const lift = o.querySelector(".lift"), p = lista[+o.dataset.i];
    o.addEventListener("pointermove", e=>{
      const r = o.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      lift.style.transform = `rotateY(${x*14}deg) rotateX(${-y*12}deg) translateZ(20px)`;
      tag.style.transform = `translate(${e.clientX + 16}px, ${e.clientY + 14}px)`;
    });
    o.addEventListener("pointerenter", ()=>{ tag.innerHTML = `${esc(corto(p))}<span class="g">(${esc(anio(p.fecha))})</span>`; tag.classList.add("on"); });
    o.addEventListener("pointerleave", ()=>{ lift.style.transform = ""; tag.classList.remove("on"); });
  });
}

/* ---------- Barra de proyectos: sale del botón y se convierte en burbuja ---------- */
const dock = $("dock"), btn = $("dockbtn");
$("dockitems").innerHTML = lista.map((p,i)=>{
  const ic = p.objeto ? `<img src="${esc(p.objeto)}" alt="">`
          : p.imagen ? `<img class="cover" src="${esc(p.imagen)}" alt="">`
          : `<span class="sw" style="${vars(p)}">${esc(corto(p).charAt(0))}</span>`;
  return `<button class="it" type="button" data-go="${i}" aria-label="${esc(corto(p))}">${ic}<span class="tip">${esc(corto(p))}</span></button>`;
}).join("");
let dockOpen = false;
function abrirDock(){
  if (dockOpen) return; dockOpen = true;
  document.body.classList.add("dock-open"); btn.setAttribute("aria-expanded","true");
  dock.classList.add("on");
  const items = dock.querySelectorAll(".x, .sep, .it");
  if (MOTOR) {
    /* Parte del tamaño y la posición del botón y crece hasta la burbuja */
    gsap.killTweensOf([dock, items]);
    gsap.set(dock, { clearProps: "x,y,scaleX,scaleY,opacity" });
    const b = btn.getBoundingClientRect(), d = dock.getBoundingClientRect();
    gsap.fromTo(dock, { x: b.left - d.left, y: b.top - d.top, scaleX: b.width / d.width, scaleY: b.height / d.height, opacity: .4 },
      { x: 0, y: 0, scaleX: 1, scaleY: 1, opacity: 1, duration: .75, ease: "expo.out", transformOrigin: "0% 50%" });
    gsap.fromTo(items, { opacity: 0, scale: .4, y: 6 }, { opacity: 1, scale: 1, y: 0, duration: .55, ease: "back.out(2)", stagger: .04, delay: .12 });
  }
  dock.querySelector(".it")?.focus({ preventScroll: true });
}
function cerrarDock(){
  if (!dockOpen) return; dockOpen = false;
  document.body.classList.remove("dock-open"); btn.setAttribute("aria-expanded","false");
  if (MOTOR) {
    const b = btn.getBoundingClientRect(), d = dock.getBoundingClientRect();
    gsap.killTweensOf(dock);
    gsap.to(dock.querySelectorAll(".x, .sep, .it"), { opacity: 0, scale: .5, duration: .2, stagger: { each: .02, from: "end" } });
    gsap.to(dock, { x: b.left - d.left, y: b.top - d.top, scaleX: b.width / d.width, scaleY: b.height / d.height, opacity: 0, duration: .5, ease: "expo.inOut", delay: .1, transformOrigin: "0% 50%",
      onComplete: () => { dock.classList.remove("on"); gsap.set(dock, { clearProps: "x,y,scaleX,scaleY,opacity" }); } });
  } else dock.classList.remove("on");
}
btn.addEventListener("click", () => dockOpen ? cerrarDock() : abrirDock());
$("dockx").addEventListener("click", () => { if (caseOpen) cerrarCaso(); cerrarDock(); btn.focus(); });
$("projlink").addEventListener("click", () => abrirDock());
dock.addEventListener("click", e=>{
  const it = e.target.closest("[data-go]"); if (!it) return;
  const p = lista[+it.dataset.go];
  if (caseOpen) abrirCaso(+it.dataset.go, null, true);
  else irA("#" + p._id);
});
function marcar(id){ dock.querySelectorAll(".it").forEach((it,k)=> it.setAttribute("aria-current", lista[k]._id === id)); }
/* Efecto lupa en la burbuja */
if (!TACTIL && !QUIETO) {
  const its = () => dock.querySelectorAll(".it");
  dock.addEventListener("pointermove", e=>{
    its().forEach(it=>{
      const r = it.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width/2));
      it.style.transform = `scale(${1 + Math.max(0, .32 - d/260)})`;
    });
  });
  dock.addEventListener("pointerleave", ()=> its().forEach(it=> it.style.transform = ""));
}

/* ---------- Ficha del trabajo: se abre creciendo desde su ventana ---------- */
const caseEl = $("case");
let caseOpen = false, origen = null, actual = -1;
function fila(t,v){ return v && !pendiente(v) ? `<div><dt>${t}</dt><dd>${esc(v)}</dd></div>` : ""; }
/* Qué se ve dentro de la ventana de la ficha */
function vistaDe(p){
  const e = String(p.enlace || "");
  if (!e) return "";
  if (p.vista) return p.vista;
  if (/\.pdf($|[?#])/i.test(e)) return "documento";
  if (!/^https?:/i.test(e)) return "web";
  return "";
}
function ventanaViva(p){
  const v = vistaDe(p), nombre = esc(p.enlace.split("/").filter(Boolean).pop());
  const barra = `<div class="bar"><i></i><i></i><i></i><span>${nombre}</span><a href="${esc(p.enlace)}" target="_blank" rel="noopener" aria-label="Abrir en una pestaña nueva">↗</a></div>`;
  const dentro = v === "documento"
    ? `<div class="pages" id="c-pages" tabindex="0" aria-label="Páginas del documento"><p class="wait">Cargando el documento…</p></div>`
    : `<iframe src="${esc(p.enlace)}" title="${esc(p.titulo)}" loading="lazy"></iframe>`;
  return `<div class="live ${v === "email" ? "email" : ""}">${barra}${dentro}</div><p class="hint">${v === "documento" ? "Desliza dentro de la ventana para pasar las páginas" : "Desliza dentro de la ventana para ver el trabajo completo"}</p>`;
}
/* PDF página a página dentro de la ventana (pdf.js se carga solo cuando hace falta) */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfjsListo = null;
function cargarPDFJS(){
  if (window.pdfjsLib) return Promise.resolve();
  return pdfjsListo ||= new Promise((ok, mal) => { const sc = document.createElement("script"); sc.src = PDFJS + "pdf.min.js"; sc.onload = ok; sc.onerror = mal; document.head.appendChild(sc); });
}
async function verPDF(cont, url){
  try {
    await cargarPDFJS();
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument(url).promise;
    cont.innerHTML = "";
    const ancho = Math.min(cont.clientWidth - 20, 1100), dpr = Math.min(devicePixelRatio || 1, 2);
    for (let n = 1; n <= pdf.numPages; n++) {
      if (!cont.isConnected) return;
      const pg = await pdf.getPage(n), base = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: ancho / base.width * dpr });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      cv.setAttribute("aria-label", `Página ${n} de ${pdf.numPages}`);
      cont.appendChild(cv);
      await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    }
  } catch (e) {
    /* Si no se puede dibujar, el navegador muestra el PDF a su manera */
    cont.outerHTML = `<iframe src="${esc(url)}" title="Documento"></iframe>`;
  }
}
function pintarCaso(i){
  const p = lista[i], [c1] = cols(p);
  const bg = p.fondo || c1, ink = sobre(bg);
  caseEl.style.setProperty("--case-bg", bg); caseEl.style.setProperty("--case-ink", ink);
  document.body.style.setProperty("--case-bg", bg); document.body.style.setProperty("--case-ink", ink);
  const sig = lista[(i+1) % lista.length];
  $("case-in").innerHTML = `
    ${vistaDe(p) ? ventanaViva(p) : `<div class="hero-w" id="c-hero">${visual(p, true)}</div>`}
    <div class="txt">
      <h2 id="c-title">${esc(p.titulo)}</h2>
      <p class="meta">${esc([p.categoria, ctxTexto(p.contexto), fechaTexto(p.fecha)].filter(Boolean).join(", "))}</p>
      ${pendiente(p.resumen) ? "" : `<p class="res">${esc(p.resumen)}</p>`}
      <dl>${fila("El reto",p.reto)}${fila("Lo que hice",p.solucion)}${fila("Resultado",p.resultado)}</dl>
      ${(p.herramientas||[]).length ? `<div class="tl">${p.herramientas.map(h=>`<span>${esc(h)}</span>`).join("")}</div>` : ""}
      ${p.enlace ? `<a class="go" href="${esc(p.enlace)}" target="_blank" rel="noopener">${vistaDe(p) ? "Abrir en una pestaña nueva" : "Ver el trabajo"} <span aria-hidden="true">↗</span></a>` : ""}
    </div>
    <div class="txt">
      ${lista.length > 1 ? `<a class="next" href="#trabajo/${sig._id}" data-next="${(i+1)%lista.length}"><small>Siguiente trabajo</small><span>${esc(corto(sig))}</span></a>` : ""}
    </div>`;
  ventanas($("case-in"));
  marcar(p._id);
  /* La ventana principal también se inclina con el ratón */
  const doc = $("c-pages"); if (doc) verPDF(doc, p.enlace);
  const hw = $("c-hero");
  if (hw && !TACTIL && !QUIETO) {
    hw.addEventListener("pointermove", e=>{ const r = hw.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; hw.style.transform = `perspective(1400px) rotateY(${x*6}deg) rotateX(${-y*5}deg)`; });
    hw.addEventListener("pointerleave", ()=> hw.style.transform = "");
  }
  if (MOTOR) gsap.from("#case-in .txt > *", { y: 30, opacity: 0, filter: "blur(10px)", duration: 1, ease: "expo.out", stagger: .06, delay: .35 });
}
function abrirCaso(i, desde, cambiar){
  actual = i;
  if (cambiar && caseOpen) {
    const fuera = () => { pintarCaso(i); caseEl.scrollTop = 0; if (MOTOR) gsap.fromTo("#case-in", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, ease: "expo.out" }); };
    MOTOR ? gsap.to("#case-in", { opacity: 0, y: -20, duration: .25, onComplete: fuera }) : fuera();
    hist("replaceState", "#trabajo/" + lista[i]._id);
    return;
  }
  origen = desde || document.activeElement;
  pintarCaso(i);
  caseOpen = true; caseEl.classList.add("on"); document.body.classList.add("case-open");
  lenis && lenis.stop(); document.documentElement.style.overflow = "hidden";
  caseEl.scrollTop = 0;
  const r = (desde && desde.getBoundingClientRect()) || { top: innerHeight*.3, left: innerWidth*.3, right: innerWidth*.7, bottom: innerHeight*.7 };
  const ini = `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round 28px)`;
  if (MOTOR) gsap.fromTo(caseEl, { clipPath: ini }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: .9, ease: "expo.inOut" });
  else caseEl.style.clipPath = "none";
  hist("pushState", "#trabajo/" + lista[i]._id);
  abrirDock();
  setTimeout(()=> caseEl.focus({ preventScroll: true }), 50);
}
function cerrarCaso(sinHistoria){
  if (!caseOpen) return; caseOpen = false;
  const st = document.getElementById(lista[actual]?._id);
  const o = st && st.querySelector(".obj");
  const fin = () => { caseEl.classList.remove("on"); document.body.classList.remove("case-open"); document.documentElement.style.overflow = ""; lenis && lenis.start(); };
  if (MOTOR && o) {
    const r = o.getBoundingClientRect();
    gsap.to(caseEl, { clipPath: `inset(${Math.max(0,r.top)}px ${Math.max(0,innerWidth - r.right)}px ${Math.max(0,innerHeight - r.bottom)}px ${Math.max(0,r.left)}px round 28px)`, duration: .7, ease: "expo.inOut", onComplete: fin });
  } else fin();
  if (!sinHistoria && location.hash.startsWith("#trabajo/")) hist("pushState", location.pathname + location.search);
  (origen || btn).focus?.({ preventScroll: true, focusVisible: false });
}
document.addEventListener("click", e=>{
  const o = e.target.closest(".obj"); if (o) { abrirCaso(+o.dataset.i, o); return; }
  const n = e.target.closest("[data-next]"); if (n) { e.preventDefault(); abrirCaso(+n.dataset.next, null, true); }
});
$("shut").addEventListener("click", () => cerrarCaso());
document.addEventListener("keydown", e=>{
  if (e.key !== "Escape") return;
  if (caseOpen) cerrarCaso(); else if (dockOpen) { cerrarDock(); btn.focus(); }
});
document.addEventListener("click", e=>{
  if (dockOpen && !caseOpen && !dock.contains(e.target) && !btn.contains(e.target) && e.target.id !== "projlink") cerrarDock();
});
/* Enlaces directos a un trabajo: tuweb/#trabajo/nombre */
function desdeHash(){
  const m = location.hash.match(/^#trabajo\/(.+)$/);
  const i = m ? lista.findIndex(p => p._id === m[1]) : -1;
  if (i >= 0) { if (caseOpen) abrirCaso(i, null, true); else { const o = document.querySelector(`#${lista[i]._id} .obj`); abrirCaso(i, o); hist("replaceState", "#trabajo/" + lista[i]._id); } }
  else if (caseOpen) cerrarCaso(true);
}
addEventListener("popstate", desdeHash);
if (location.hash.startsWith("#trabajo/")) desdeHash();
</script>
</body>
</html>
